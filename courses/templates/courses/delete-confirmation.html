{% extends 'base.html' %}

{% block title %}
  Delete Course
{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow border-0">
          <div class="card-body p-5 text-center">
            <!-- Warning Icon -->
            <div class="mb-4">
              <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
            </div>

            <!-- Title -->
            <h2 class="fw-bold mb-3 text-danger">Delete Course</h2>

            <!-- Message -->
            <p class="text-muted mb-4">
              Are you sure you want to delete

              <strong>"{{ title }}"</strong>

              ?
            </p>

            <p class="text-muted mb-5">This action cannot be undone.</p>

            <!-- Buttons -->
            <form method="POST">
              {% csrf_token %}

              <div class="d-flex gap-3 justify-content-center">
                <!-- Cancel -->
                <a href="{% url 'instructor-courses' %}" class="btn btn-outline-secondary px-4">Cancel</a>

                <!-- Delete -->
                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
