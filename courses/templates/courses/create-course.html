{% extends 'base.html' %}

{% block title %}
  Create Course
{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-lg border-0">
          <div class="card-body p-5">
            <h2 class="text-center mb-4 fw-bold">Create New Course</h2>

            <form method="POST">
              {% csrf_token %}

              <!-- Title -->
              <div class="mb-4">
                <label class="form-label fw-semibold">Course Title</label>

                {{ form.title }}
              </div>

              <!-- Description -->
              <div class="mb-4">
                <label class="form-label fw-semibold">Description</label>

                {{ form.description }}
              </div>

              <!-- Category -->
              <div class="mb-4">
                <label class="form-label fw-semibold">Category</label>

                {{ form.category }}
              </div>

              <!-- Level -->
              <div class="mb-4">
                <label class="form-label fw-semibold">Level</label>

                {{ form.level }}
              </div>

              <!-- Submit -->
              <button class="btn btn-primary w-100 py-2">Create Course</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
